train_dir: data/raw/train
test_dir: data/raw/student_test
K: 8
radius_m: 200
seed: 42
cv_folds: 5
exclude_train_trips: ["00000033", "00000054"]

# API (Laptop 1): folder of trips the API serves; point at the 10 evaluator trips later. Decoder: "classifier" or "hmm".
eval_trips_dir: data/raw/student_test
decoder: hmm

# HMM + Viterbi decoder (src/hmm.py). Tuned on the 10 student_test trips: results/csv/hmm_param_search.csv
hmm:
  transition_floor: 1e-10
  gap_threshold_s: 60
  emission_epsilon: 1e-12
